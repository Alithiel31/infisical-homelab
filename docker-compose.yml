services:
  infisical:
    image: infisical/infisical@sha256:204bd63c7a281d9157752ce0bf8d506e7380cac5a0665324eeab8d580b069266  # figé le 2026-09-30
    container_name: infisical
    labels:
      - "homelab.tier=infra"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
      - "100.109.50.124:8090:8080"
    env_file:
      - .env
    environment:
      - DB_CONNECTION_URI=postgresql://infisical_app:${DB_PASSWORD}@${DB_HOST}:5432/infisical
      - REDIS_URL=redis://infisical-redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - SITE_URL=${INFISICAL_SITE_URL}
      - NODE_ENV=production
    depends_on:
      - infisical-redis
    # Pas de réseau traefik-net ici : accès direct via Tailscale uniquement.
    # Si tu veux router via Traefik plus tard (nom court sans port), ajoute :
    # networks:
    #   - traefik-net
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.infisical.rule=Host(`vault.caesura.<tailnet>.ts.net`)"
    #   - "traefik.http.services.infisical.loadbalancer.server.port=8080"

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    labels:
      - "homelab.tier=infra"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    # Pas de port exposé sur l'hôte : uniquement accessible par infisical via le réseau interne du compose

# networks:
#   traefik-net:
#     external: true
  mailpit:
    image: axllent/mailpit@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d  # figé le 2026-09-30
    container_name: mailpit
    labels:
      - "homelab.tier=infra"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "100.109.50.124:8025:8025"
    # SMTP interne (port 1025) consommé par infisical ; UI web (8025) accessible via Tailscale pour lire l'email de reset
