services:
  infisical:
    image: infisical/infisical@sha256:204bd63c7a281d9157752ce0bf8d506e7380cac5a0665324eeab8d580b069266  # figé le 2026-09-30
    container_name: infisical
    labels:
      - "homelab.tier=infra"
      - "traefik.enable=true"
      - "traefik.http.routers.infisical.entrypoints=internal"
      - "traefik.http.routers.infisical.rule=Host(`vault.caesura.internal`)"
      - "traefik.http.services.infisical.loadbalancer.server.port=8080"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
      - "${TAILSCALE_IP:?TAILSCALE_IP manquant dans .env}:8090:8080"
    env_file:
      - .env
    environment:
      - DB_CONNECTION_URI=postgresql://infisical_app:${DB_PASSWORD}@${DB_HOST}:5432/infisical
      - REDIS_URL=redis://infisical-redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - SITE_URL=${INFISICAL_SITE_URL}
      - NODE_ENV=production
      # SMTP : Mailpit mutualisé (projet mailpit/), joint via l'IP Tailscale de l'hôte
      # (puits sans authentification ni TLS)
      - SMTP_HOST=${TAILSCALE_IP}
      - SMTP_PORT=1025
      - SMTP_IGNORE_TLS=true
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:-infisical@caesura.local}
      - SMTP_FROM_NAME=Infisical
    depends_on:
      - infisical-redis
    networks:
      - default
      - traefik-net
    # Les ports 8090 restent publiés (accès direct par IP:port) en parallèle de vault.caesura.internal.

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical-redis
    labels:
      - "homelab.tier=infra"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    # Pas de port exposé sur l'hôte : uniquement accessible par infisical via le réseau interne du compose

networks:
  traefik-net:
    external: true
